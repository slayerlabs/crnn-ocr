# Wszystkie hiperparametry i ścieżki w jednym miejscu.
# Uruchomienie: python main.py --config configs/default.yaml

data:
  train_dir: data/raw/train
  val_dir: data/raw/val
  charset_file: configs/charset.json   # przebudowa: python data/charset.py
  batch_size: 32
  num_workers: 0                       # 0 = najbezpieczniej na Windowsie

model:
  lstm_hidden: 256
  lstm_layers: 2

train:                                 # parametry treningu (train.py)
  device: auto                         # auto | cpu | cuda
  epochs: 20
  lr: 0.001
  seed: 42                             # torch.manual_seed — reprodukowalność
  log_every: 50                        # co ile stepów log (konsola + TensorBoard)
  grad_clip: 5.0                       # clip gradientów (LSTM lubi eksplodować); null = off
  checkpoint_dir: checkpoints
  log_dir: runs                        # tensorboard --logdir runs
